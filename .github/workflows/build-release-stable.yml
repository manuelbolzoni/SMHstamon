name: Build SMHstamon release
on:
  push:
    branches: [master, 'release/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxkbcommon0 libxcb-cursor0 libpulse0
      - run: python -m pip install -r build/requirements/smhub.txt
      - name: Test Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_smhub.py -v
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -p test_smhub.py -v
  windows:
    if: github.ref != 'refs/heads/master'
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r build/requirements/smhub.txt 'pyinstaller>=6.10,<7'
      - name: Build portable and installer ZIPs
        shell: pwsh
        run: python build/release.py windows --iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Smoke test portable executable
        shell: pwsh
        run: |
          Expand-Archive dist/release/*-win64.zip -DestinationPath dist/smoke
          $exe = (Resolve-Path dist/smoke/SMHstamon/SMHstamon.exe).Path
          $config = Join-Path $env:RUNNER_TEMP 'smhstamon-smoke'
          New-Item -ItemType Directory -Force $config | Out-Null
          $process = Start-Process -FilePath $exe -ArgumentList $config -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) { throw "SMHstamon exited during startup: $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Smoke test installer
        shell: pwsh
        run: |
          Expand-Archive dist/release/*_setup.zip -DestinationPath dist/setup-smoke
          $setup = (Get-ChildItem dist/setup-smoke/*.exe).FullName
          $installed = Join-Path $env:RUNNER_TEMP 'smhstamon-installed'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""', "/DIR=$installed")
          $installer = Start-Process -FilePath $setup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $exe = Join-Path $installed 'SMHstamon.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable is missing' }
          $config = Join-Path $env:RUNNER_TEMP 'smhstamon-installed-config'
          New-Item -ItemType Directory -Force $config | Out-Null
          $process = Start-Process -FilePath $exe -ArgumentList $config -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) { throw "Installed application exited: $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/release/*.zip
          if-no-files-found: error
  linux:
    if: github.ref != 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpm xvfb
      - run: python3 build/release.py linux
      - name: Install and smoke test DEB
        run: |
          sudo apt-get install -y ./dist/release/*.deb
          mkdir -p "$RUNNER_TEMP/smhstamon-smoke"
          set +e
          QT_QPA_PLATFORM=offscreen xvfb-run -a timeout 10s smhstamon "$RUNNER_TEMP/smhstamon-smoke" > dist/smoke.log 2>&1
          result=$?
          set -e
          cat dist/smoke.log
          test "$result" -eq 124
          ! grep -q 'Traceback (most recent call last)' dist/smoke.log
      - name: Install and smoke test RPM on Fedora
        run: |
          docker run --rm -v "$PWD/dist/release:/packages:ro" fedora:43 bash -c '
            set -e
            dnf install -y /packages/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth
            mkdir -p /tmp/config
            touch /root/.Xauthority
            Xvfb :99 -screen 0 1280x800x24 &
            sleep 2
            set +e
            DISPLAY=:99 QT_QPA_PLATFORM=offscreen timeout 10s smhstamon /tmp/config > /tmp/smoke.log 2>&1
            result=$?
            set -e
            cat /tmp/smoke.log
            test "$result" -eq 124
            ! grep -q "Traceback (most recent call last)" /tmp/smoke.log
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/release/*.deb
            dist/release/*.rpm
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find release-assets -type f | wc -l)" -eq 4
          test "$GITHUB_REF_NAME" = "v$(python3 -c 'import runpy; print(runpy.run_path("build/release.py")["version"]())')"
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "SMHstamon ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
