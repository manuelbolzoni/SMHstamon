name: Test pull requests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r build/requirements/smhub.txt
      - run: python -m unittest discover -s tests -p test_smhub.py -v
